<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>増殖</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" hidden>

  <header id="topbar">
    <div class="brand">増殖<span id="sim-badge" class="badge">—</span></div>

    <div class="stats" id="stats"></div>

    <div class="topright">
      <button class="btn ghost" id="btn-report">帰還報告</button>
      <button class="btn war" id="btn-war" hidden>隣のシャーレ</button>
      <div class="clock" id="clock"></div>
      <div class="speed" id="speed"></div>
    </div>

    <!-- 世代の進み。P1では10秒に1tickしか来ないので、これが無いと停止と区別できない -->
    <div id="genbar"><i></i></div>
  </header>

  <main>
    <section id="stage">
      <canvas id="dish"></canvas>
      <div id="legend">
        <div class="lg"><b>色相</b> 血統の混合比</div>
        <div class="lg"><b>彩度</b> 練度</div>
        <div class="lg"><b>明度</b> 年齢・体力</div>
        <div class="lg"><b>目</b> 感応の高さ／恐怖で細くなる</div>
      </div>
      <div id="strains"></div>
      <div id="toast"></div>
    </section>

    <aside id="dock">
      <nav id="tabs"></nav>
      <div id="tabbody"></div>
    </aside>
  </main>

</div>

<div id="modal-root"></div>

<script type="module" src="src/ui/main.js"></script>
</body>
</html>
