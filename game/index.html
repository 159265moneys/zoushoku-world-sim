<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>増殖</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app" hidden>

  <!-- トップバー：読み取り（数値）と時間の操作だけ。
       行動のボタンは混ぜない（読むものと押すものが同じ帯に並ぶと種類を取り違える）。 -->
  <header id="topbar">
    <div class="brand">増殖<span id="sim-badge" class="badge">—</span></div>
    <div class="stats" id="stats"></div>
    <div class="topright">
      <div class="clock" id="clock"></div>
      <div class="speed" id="speed"></div>
    </div>
    <div id="genbar"><i></i></div>
  </header>

  <main>
    <section id="stage">
      <canvas id="dish"></canvas>

      <!-- 個体パネル：「一体だけ」の画面。
           国ぜんたいのドック（右）とは別の場所・別の色に置く。
           これをタブ列に混ぜると「他のタブも個体にかかる」と読まれる。 -->
      <aside id="indpanel" hidden>
        <div id="indhead">
          <div class="scope">◂ この一体だけ</div>
          <button class="x" id="ind-close">閉じる ✕</button>
        </div>
        <div id="indbody"></div>
      </aside>

      <div id="strains"></div>
      <div id="legend"></div>
      <div id="toast"></div>
    </section>

    <!-- ドック：「国ぜんたい」の画面。ここに個体1体のタブは置かない。 -->
    <aside id="dock">
      <div id="dockhead"><div class="scope">▪ 国ぜんたい</div></div>
      <div id="todo"></div>
      <nav id="tabs"></nav>
      <div id="tabbody"></div>
    </aside>
  </main>

</div>

<div id="modal-root"></div>

<script type="module" src="src/ui/main.js"></script>
</body>
</html>
