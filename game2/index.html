<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>増殖</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header id="bar">
  <div class="clock">
    <span id="daybar" title="今月の進み具合"><i></i></span>
    <b id="date">1年1月1日</b>
    <span id="season" class="pill s0">春</span>
    <span id="tickno" class="dim dev">0 tick</span>
  </div>

  <div class="gauges">
    <div class="g"><b id="pop">10</b><i>人口</i><u id="popsub"></u></div>
    <div class="g"><b id="houses">5 / 30</b><i>家</i><u id="housesub"></u></div>
    <div class="g wide">
      <b id="food">0</b><i>蔵</i><u id="foodsub"></u>
      <span class="meter"><i id="foodbar"></i></span>
    </div>
  </div>

  <div class="ctl">
    <button id="playbtn" title="空白キー">▶</button>
    <span id="speeds" class="speeds"></span><span id="speedhint" class="dim"></span>
    <button id="stepday" class="ghost" title="1日だけ進める（.）">＋1日</button>
    <button id="stepmonth" class="ghost">＋1ヶ月</button>
    <button id="fitbtn" class="ghost" title="全体を映す（f）">全体</button>
    <span id="seedlabel" class="dim"></span>
  </div>
</header>

<div id="banners">
  <div id="ration" class="banner" hidden></div>
  <div id="extinct" class="banner bad" hidden>絶滅した。ここには誰もいない</div>
</div>

<main>
  <div id="stage">
    <canvas id="map"></canvas>
    <!-- 個体だけを描く層。WebGL2。背景と家の箱は #map（Canvas2D）のまま -->
    <canvas id="actors"></canvas>
    <!-- 名札。個体より上でないと体に隠れる -->
    <canvas id="labels"></canvas>
  </div>
  <aside id="side">
    <section id="detail"></section>

    <section class="dev" id="devbox">
      <h3>収束計<small>開発用。本番には出さない（A-14／A-11）</small></h3>
      <div id="devout"></div>
      <div class="row">
        <button id="ff10" class="ghost">10年飛ばす</button>
        <button id="ff100" class="ghost">100年飛ばす</button>
      </div>
    </section>

    <!-- ★ 2026-08-31：方針カード（#18 §1）を触る手段が無かった。
         `cards.set()` を呼ぶのが検査の1行だけで、src/flow・src/ui に `cards` の
         識別子が一度も現れていなかった（＝11枚あるのに全部が既定のまま） -->
    <section id="cardbox">
      <h3>方針カード<small>#18 §1。段は −2〜+2。既定と同じ段なら1バイトも使わない</small></h3>
      <div id="cardlist"></div>
    </section>

    <section id="chron">
      <h3>年代記<small>初めて起きたことだけが載る</small></h3>
      <ul id="chronlist"></ul>
    </section>
  </aside>
</main>

<div id="toast"></div>

<script type="module">
import './src/ui/main.js';
</script>
</body>
</html>
