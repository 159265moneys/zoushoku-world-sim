<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家（単体・新規）</title>
<style>
  html,body{margin:0;height:100%;background:#0d1013;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:crosshair}
  #hint{position:fixed;left:12px;bottom:10px;color:#5d666e;
        font:12px/1.6 -apple-system,"Hiragino Sans",sans-serif;pointer-events:none;user-select:none}
  #hint b{color:#8b959d;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">ホイールで拡大縮小　<b id="z">×1.00</b></div>

<script>
// 家だけの画面。**この頁は他の一切を読み込まない。**素の Canvas2D で完結する。
//
// 決めごとは3つだけ：
//   ・最大拡大（zoom = 1）＝ 屋根のない箱を真上から見た絵。中にキャラが2体
//   ・引くと屋根が被さり、中は見えなくなる
//   ・その間は混ぜて渡す。ぶつっと切り替わると「隠れた」ではなく「消えた」に見える

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const zlabel = document.getElementById('z');

const ZMIN = 0.16, ZMAX = 1.0;   // 1.0 が最大拡大。それ以上は寄れない
const HOUSE = 440;               // 最大拡大時の家の外寸（px）
let zoom = ZMAX;

// 0→1 の滑らかな渡し。t が a のとき 0、b のとき 1
const ramp = (t, a, b) => {
  const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
  return x * x * (3 - 2 * x);
};

function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(innerWidth  * dpr);
  cv.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

// ---- 個体 ------------------------------------------------------------------
// 頭と胴だけ。**意味は何も載せていない。**ここでは2体いることだけが要件
function drawPerson(x, y, s, skin, cloth) {
  ctx.save();
  ctx.translate(x, y);

  // 足元の影。これが無いと床に貼り付いた紙に見える
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath();
  ctx.ellipse(0, s * 0.62, s * 0.42, s * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();

  // 胴。下すぼまりの台形
  ctx.fillStyle = cloth;
  ctx.beginPath();
  ctx.moveTo(-s * 0.30, -s * 0.05);
  ctx.lineTo( s * 0.30, -s * 0.05);
  ctx.lineTo( s * 0.24,  s * 0.60);
  ctx.lineTo(-s * 0.24,  s * 0.60);
  ctx.closePath();
  ctx.fill();

  // 頭
  ctx.fillStyle = skin;
  ctx.beginPath();
  ctx.arc(0, -s * 0.36, s * 0.30, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

// ---- 家 --------------------------------------------------------------------
// 屋根のない箱。外枠を壁の色で塗って、内側を床の色で塗り返すだけ
function drawOpenBox(cx, cy, size) {
  const h = size / 2;
  const wall = Math.max(2, size * 0.055);

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)';
  ctx.shadowBlur = size * 0.08;
  ctx.shadowOffsetY = size * 0.02;
  ctx.fillStyle = '#6a5744';                       // 壁
  ctx.fillRect(cx - h, cy - h, size, size);
  ctx.restore();

  ctx.fillStyle = '#3b332b';                       // 床
  ctx.fillRect(cx - h + wall, cy - h + wall, size - wall * 2, size - wall * 2);

  // 壁の内側の落ち影。箱に深さが出る
  ctx.strokeStyle = 'rgba(0,0,0,.35)';
  ctx.lineWidth = Math.max(1, wall * 0.5);
  ctx.strokeRect(cx - h + wall + ctx.lineWidth / 2, cy - h + wall + ctx.lineWidth / 2,
                 size - wall * 2 - ctx.lineWidth, size - wall * 2 - ctx.lineWidth);

  ctx.strokeStyle = 'rgba(0,0,0,.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(cx - h + .5, cy - h + .5, size - 1, size - 1);
}

// 屋根。真上から見た寄棟。四隅から中央へ稜線が集まる
function drawRoof(cx, cy, size) {
  const h = size / 2 * 1.07;                       // 軒が壁より少し出る
  const p = [[cx - h, cy - h], [cx + h, cy - h], [cx + h, cy + h], [cx - h, cy + h]];
  const face = ['#8d6f52', '#6b543e', '#5a4634', '#7a6046']; // 上・右・下・左（光は左上から）

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = size * 0.10;
  ctx.shadowOffsetY = size * 0.03;
  ctx.fillStyle = face[0];
  ctx.fillRect(cx - h, cy - h, h * 2, h * 2);      // 影は一度だけ落とす
  ctx.restore();

  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = face[i];
    ctx.beginPath();
    ctx.moveTo(p[i][0], p[i][1]);
    ctx.lineTo(p[(i + 1) % 4][0], p[(i + 1) % 4][1]);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();
  }

  ctx.strokeStyle = 'rgba(0,0,0,.30)';
  ctx.lineWidth = Math.max(1, size * 0.006);
  for (const q of p) { ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(cx, cy); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(0,0,0,.45)';
  ctx.lineWidth = 1;
  ctx.strokeRect(cx - h + .5, cy - h + .5, h * 2 - 1, h * 2 - 1);
}

// ---- 一枚 ------------------------------------------------------------------
function draw() {
  const W = innerWidth, H = innerHeight;
  ctx.fillStyle = '#0d1013';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const size = HOUSE * zoom;

  // 寄っているほど 1。中が見えるかどうかはこれ1つで決める
  const inside = ramp(zoom, 0.50, 0.80);

  drawOpenBox(cx, cy, size);

  if (inside > 0.01) {                              // 中の2体
    ctx.save();
    ctx.globalAlpha = inside;
    const s = size * 0.20;
    drawPerson(cx - size * 0.20, cy + size * 0.06, s, '#e6c69b', '#4f7fa8');
    drawPerson(cx + size * 0.19, cy - size * 0.08, s, '#d9b184', '#a85f52');
    ctx.restore();
  }

  if (inside < 0.99) {                              // 屋根が被さる
    ctx.save();
    ctx.globalAlpha = 1 - inside;
    drawRoof(cx, cy, size);
    ctx.restore();
  }

  zlabel.textContent = '×' + zoom.toFixed(2);
}

// ---- 入力 ------------------------------------------------------------------
addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.min(ZMAX, Math.max(ZMIN, zoom * Math.exp(-e.deltaY * 0.0015)));
  draw();
}, { passive: false });

addEventListener('resize', resize);
resize();
</script>
</body>
</html>
