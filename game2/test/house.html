<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家（単体・新規）</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f0a;overflow:hidden}
  #stage{position:fixed;inset:0}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%}
  #actors{pointer-events:none}
  #hint{position:fixed;left:12px;bottom:10px;color:#5d666e;
        font:12px/1.6 -apple-system,"Hiragino Sans",sans-serif;pointer-events:none;user-select:none}
  #hint b{color:#8b959d;font-weight:600}
  #note{color:#c08a5a}
</style>
</head>
<body>
<div id="stage">
  <canvas id="map"></canvas>
  <canvas id="actors"></canvas>
</div>
<div id="hint">ホイールで拡大縮小　<b id="z">×1.00</b>　<span id="px"></span>　<span id="note"></span></div>

<script type="module">
// 家だけの画面。**この頁は世界（sim）を一切読み込まない。**
// 読むのは葉っぱの2つだけ：個体の描画層（WebGL2）と、種族の見た目の定数。
//
// 寸法は本編に合わせてある（勝手な大きさを持たない）：
//   家の箱   `map.js boxRect()` ＝ 幅72・高さ26（世界単位）。ここでは要件どおり 72×72 の正方形
//   個体     `map.js radiusOf()` ＝ 3.2 + 5.2×育ち。成人で r=8.4
//   ×1.00   本編の村ズーム等倍。**家はこれ以上大きくならない**
//            （縮めていくと村・街・国・世界地図の段に入る。その段はまだ無い）
//
// 見えかたの決めごと：
//   ・寄り切り（×1）＝ 屋根のない箱を真上から。中に2体
//   ・引くと屋根が被さり、中は見えなくなる
//   ・中の2体は屋根より先に消える。屋根の下から透ける絵にならないように
//
// **読み込みで転んでも黒い画面にしない。**
// static な import にすると `file://`（ダブルクリックで開いた場合）でブラウザが
// CORS で止め、**スクリプトごと死んで何も出ない。**動的 import にして拾い、
// 拾えなければ個体だけ 2D の丸に落とす（map.js の `_person2d` と同じ落とし先）。

const cv  = document.getElementById('map');
const ctx = cv.getContext('2d');
const glcv = document.getElementById('actors');
const zlabel = document.getElementById('z');
const pxlabel = document.getElementById('px');
const note = document.getElementById('note');

const BOX = 72;                  // 家の箱の一辺（世界単位）。map.js の boxRect().w と同じ
const R_ADULT = 3.2 + 5.2;       // 成人の半径。map.js の radiusOf(grow=1)
const ZMIN = 0.12, ZMAX = 1.0;   // ×1 が寄り切り。**家の最大は 72px**
let zoom = ZMAX;
let dpr = 1;

// ---- 移植ぶん（読めたら本物、読めなければこの既定値で 2D に落とす） --------
// **種族の見た目は既定値を自前で持つ。**`looks.js` の `DEFAULT_RACE` と `FOUNDER_HUE` は
// A-24 の作業中のもので、**まだ main に入っていない**（手元にしか無い）。
// 手元では本物が読まれ、Pages では既定値になる。値は同じなので絵は変わらない。
let actors = null;                                  // ActorLayer（WebGL2）
let SAT_ALIVE = 0.46;                               // actors.js SAT_ALIVE
let RACE = { corners: 6, stripeV: 0, stripeH: 2 };  // looks.js DEFAULT_RACE
let HUES = [142.0, 147.3];                          // looks.js FOUNDER_HUE の 0番目と3番目
const SPECIAL_NONE = 0;

// 住人2体。**同じ種族**（A-24）なので色も形も揃う。違うのは血の枠と熟練だけ
const FOLK = [
  { dx: -0.20, dy:  0.07, h: 0, cells: 3, weak: 0 },
  { dx:  0.19, dy: -0.09, h: 1, cells: 6, weak: 0 },
];

// 0→1 の滑らかな渡し。t が a のとき 0、b のとき 1
const ramp = (t, a, b) => {
  const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
  return x * x * (3 - 2 * x);
};

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(innerWidth  * dpr);
  cv.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (actors) actors.resize(innerWidth, innerHeight, dpr);
  draw();
}

// ---- 家 --------------------------------------------------------------------
// 屋根のない箱。外枠を壁の色で塗って、内側を床の色で塗り返すだけ
function drawOpenBox(cx, cy, size) {
  const h = size / 2;
  const wall = Math.max(1.5, size * 0.075);

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)';
  ctx.shadowBlur = size * 0.10;
  ctx.shadowOffsetY = size * 0.03;
  ctx.fillStyle = '#7d7159';                       // 壁。map.js の boxEdge
  ctx.fillRect(cx - h, cy - h, size, size);
  ctx.restore();

  ctx.fillStyle = '#232019';                       // 床。map.js の box
  ctx.fillRect(cx - h + wall, cy - h + wall, size - wall * 2, size - wall * 2);

  ctx.strokeStyle = 'rgba(0,0,0,.40)';             // 壁の内側の落ち影。箱に深さが出る
  ctx.lineWidth = Math.max(1, wall * 0.45);
  const o = wall + ctx.lineWidth / 2;
  ctx.strokeRect(cx - h + o, cy - h + o, size - o * 2, size - o * 2);
}

// 屋根。真上から見た寄棟。四隅から中央へ稜線が集まる
function drawRoof(cx, cy, size) {
  const h = size / 2 * 1.10;                       // 軒が壁より少し出る
  const p = [[cx - h, cy - h], [cx + h, cy - h], [cx + h, cy + h], [cx - h, cy + h]];
  const face = ['#8d7f5f', '#6b6047', '#59503b', '#7a6e51']; // 上・右・下・左（光は左上から）

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = size * 0.12;
  ctx.shadowOffsetY = size * 0.04;
  ctx.fillStyle = face[0];
  ctx.fillRect(cx - h, cy - h, h * 2, h * 2);      // 影は一度だけ落とす
  ctx.restore();

  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = face[i];
    ctx.beginPath();
    ctx.moveTo(p[i][0], p[i][1]);
    ctx.lineTo(p[(i + 1) % 4][0], p[(i + 1) % 4][1]);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();
  }

  if (size > 26) {                                 // 小さいと稜線は潰れて汚れになるだけ
    ctx.strokeStyle = 'rgba(0,0,0,.28)';
    ctx.lineWidth = Math.max(1, size * 0.008);
    for (const q of p) { ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(cx, cy); ctx.stroke(); }
  }
}

// ---- 一枚 ------------------------------------------------------------------
function draw() {
  const W = innerWidth, H = innerHeight;
  ctx.fillStyle = '#0d0f0a';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const size = BOX * zoom;

  // 中の2体は屋根より先に消える。両方が半端に濃い区間を作らない
  const seen = ramp(zoom, 0.60, 0.80);             // 中の見え具合
  const roof = 1 - ramp(zoom, 0.46, 0.66);         // 屋根の被さり具合

  drawOpenBox(cx, cy, size);

  const r = Math.max(1.1, R_ADULT * zoom);
  if (actors) {
    actors.begin(FOLK.length);
    if (seen > 0.01) {
      for (const f of FOLK) {
        actors.push(
          (cx + f.dx * size) * dpr, (cy + f.dy * size) * dpr, r * dpr,
          f.weak,                                   // 明度＝弱っている、それだけ
          HUES[f.h], HUES[f.h], 0,                  // 同じ種族なので沈殿は出ない
          SAT_ALIVE,                                // 彩度＝生死
          RACE.corners, SPECIAL_NONE, RACE.stripeV, RACE.stripeH,
          f.cells);                                 // 細胞＝熟練
      }
    }
    actors.flush();
    glcv.style.opacity = seen.toFixed(3);
  } else if (seen > 0.01) {                        // 落とし先。丸と色相だけ（map.js _person2d）
    ctx.save();
    ctx.globalAlpha = seen;
    for (const f of FOLK) {
      ctx.beginPath();
      ctx.arc(cx + f.dx * size, cy + f.dy * size, r, 0, Math.PI * 2);
      ctx.fillStyle = `hsl(${HUES[f.h].toFixed(0)} ${(SAT_ALIVE * 100).toFixed(0)}% `
        + `${(66 * (1 - 0.42 * f.weak)).toFixed(0)}%)`;
      ctx.fill();
    }
    ctx.restore();
  }

  if (roof > 0.01) {
    ctx.save();
    ctx.globalAlpha = roof;
    drawRoof(cx, cy, size);
    ctx.restore();
  }

  zlabel.textContent = '×' + zoom.toFixed(2);
  pxlabel.textContent = `家 ${size.toFixed(0)}px`;
}

// ---- 入力 ------------------------------------------------------------------
addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.min(ZMAX, Math.max(ZMIN, zoom * Math.exp(-e.deltaY * 0.0015)));
  draw();
}, { passive: false });

addEventListener('resize', resize);

// ---- 立ち上げ --------------------------------------------------------------
(async () => {
  // 個体の描画層。**これだけは本物を使う。**読めなければ丸に落とす
  try {
    const A = await import('../src/ui/actors.js');
    SAT_ALIVE = A.SAT_ALIVE;
    const layer = new A.ActorLayer(glcv);
    if (layer.ok) actors = layer;
    else note.textContent = 'WebGL2 が無い。個体は丸で描く';
  } catch (e) {
    // **黒い画面のまま黙らない。理由をそのまま出す。**
    // file:// で開くと CORS で読めない（サーバー経由なら読める）。それ以外の理由もありうる
    note.textContent = `個体の層を読めない（${e.message}）。丸で描く`;
  }
  // 種族の見た目。**無くてもいい。**上の既定値で描けるので、ここで転ばせない
  try {
    const L = await import('../src/world/looks.js');
    if (L.DEFAULT_RACE) RACE = L.DEFAULT_RACE;
    if (L.FOUNDER_HUE && L.FOUNDER_HUE.length >= 4) HUES = [L.FOUNDER_HUE[0], L.FOUNDER_HUE[3]];
  } catch (e) { /* main にはまだ無い。既定の種族で描く */ }
  resize();
})();
</script>
</body>
</html>
