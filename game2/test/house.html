<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家（単体・新規）</title>
<style>
  html,body{margin:0;height:100%;background:#0d0f0a;overflow:hidden}
  #stage{position:fixed;inset:0}
  #stage canvas{position:absolute;inset:0;width:100%;height:100%}
  #actors{pointer-events:none}
  #hint{position:fixed;left:12px;bottom:10px;color:#5d666e;
        font:12px/1.6 -apple-system,"Hiragino Sans",sans-serif;pointer-events:none;user-select:none}
  #hint b{color:#8b959d;font-weight:600}
  #note{color:#c08a5a}
</style>
</head>
<body>
<div id="stage">
  <canvas id="map"></canvas>
  <canvas id="actors"></canvas>
</div>
<div id="hint">ホイールで拡大縮小　<b id="z">×1.00</b>　<span id="px"></span>　<span id="note"></span></div>

<script type="module">
// 家だけの独立画面。**見た目は何ひとつ、この頁が決めない。**
//
// キャラ班の裁定（2026-08-24）：
//   ・個体の見た目（色相・角の数・縞・彩度・細胞・大きさ）を決めるのは本編のモジュール。
//     **テスト画面が値を写して既定値にしてはいけない**
//   ・とくに「種族の色 150 / 六角 / 縞 0・2」は**誰の決定でもない。**
//     A-24 を実装する途中で実装側が置いた仮の値で、A-24 自身は
//     「種族は開幕の診断（A-6-1）で決まる」と言っている。写せば嘘になる
//   ・読めなかったときは、**それらしい絵を描かない。**中立な灰色の丸に落とし、
//     読めていないことを画面に出す。本物と見分けがつくことが要件
//
// だからこの頁は本編のモジュールをそのまま読む（前版は「世界を読み込まない」という
// 私の自己ルールのために値を写し、**main とも作業中の版とも違う絵**を黙って出していた）：
//   箱の大きさ   `ui/map.js`   boxRect()
//   個体の半径   `ui/map.js`   radiusOf()
//   彩度         `ui/actors.js` SAT_ALIVE
//   色相         `flow/run.js` FOUNDER_HUE（main はここ、A-24 後は looks.js を再輸出）
//   細胞         `flow/run.js` cellsOf()
//   形と模様     `world/looks.js` foundLook() → lookOf() / bloodTop2()
//
// **この頁が決めてよいのは題材だけ。**カメラ（どこまで寄る・引く／屋根の被さり方）、
// 個体を2体置くこと、その立ち位置、そして入力（どの血の枠か・成人か・熟練いくつか）。

const cv  = document.getElementById('map');
const ctx = cv.getContext('2d');
const glcv = document.getElementById('actors');
const zlabel = document.getElementById('z');
const pxlabel = document.getElementById('px');
const note = document.getElementById('note');

const ZMIN = 0.12, ZMAX = 1.0;   // ×1 が寄り切り。家はこれ以上大きくならない
const SEED = 20260821;           // 決まった乱数。同じ種から同じ2体が出る
let zoom = ZMAX;
let dpr = 1;

// 題材。**見た目ではなく入力。**どの血の枠の者が、どれだけ熟練して、どこに立っているか
const CAST = [
  { founder: 0, mastery: 12, weak: 0, dx: -0.20, dy:  0.07 },
  { founder: 3, mastery: 24, weak: 0, dx:  0.19, dy: -0.09 },
];

// ---- 本編から読むもの。読めるまで何も持たない ------------------------------
let actors = null;               // ActorLayer（WebGL2）
let folk = null;                 // 本物の見た目。読めなければ null のまま
let BOX = 72;                    // 実物を読めなかったときの最後の逃げ道。**根拠ではない**
let R_ADULT = 8.4;               // 同上
let SAT = 0.46;                  // 同上

// 0→1 の滑らかな渡し。t が a のとき 0、b のとき 1
const ramp = (t, a, b) => {
  const x = Math.min(1, Math.max(0, (t - a) / (b - a)));
  return x * x * (3 - 2 * x);
};

function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width  = Math.round(innerWidth  * dpr);
  cv.height = Math.round(innerHeight * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (actors) actors.resize(innerWidth, innerHeight, dpr);
  draw();
}

// ---- 家 --------------------------------------------------------------------
// 屋根のない箱。外枠を壁の色で塗って、内側を床の色で塗り返すだけ
function drawOpenBox(cx, cy, size) {
  const h = size / 2;
  const wall = Math.max(1.5, size * 0.075);

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)';
  ctx.shadowBlur = size * 0.10;
  ctx.shadowOffsetY = size * 0.03;
  ctx.fillStyle = '#7d7159';                       // 壁。map.js の boxEdge
  ctx.fillRect(cx - h, cy - h, size, size);
  ctx.restore();

  ctx.fillStyle = '#232019';                       // 床。map.js の box
  ctx.fillRect(cx - h + wall, cy - h + wall, size - wall * 2, size - wall * 2);

  ctx.strokeStyle = 'rgba(0,0,0,.40)';             // 壁の内側の落ち影。箱に深さが出る
  ctx.lineWidth = Math.max(1, wall * 0.45);
  const o = wall + ctx.lineWidth / 2;
  ctx.strokeRect(cx - h + o, cy - h + o, size - o * 2, size - o * 2);
}

// 屋根。真上から見た寄棟。四隅から中央へ稜線が集まる
function drawRoof(cx, cy, size) {
  const h = size / 2 * 1.10;                       // 軒が壁より少し出る
  const p = [[cx - h, cy - h], [cx + h, cy - h], [cx + h, cy + h], [cx - h, cy + h]];
  const face = ['#8d7f5f', '#6b6047', '#59503b', '#7a6e51']; // 上・右・下・左（光は左上から）

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = size * 0.12;
  ctx.shadowOffsetY = size * 0.04;
  ctx.fillStyle = face[0];
  ctx.fillRect(cx - h, cy - h, h * 2, h * 2);      // 影は一度だけ落とす
  ctx.restore();

  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = face[i];
    ctx.beginPath();
    ctx.moveTo(p[i][0], p[i][1]);
    ctx.lineTo(p[(i + 1) % 4][0], p[(i + 1) % 4][1]);
    ctx.lineTo(cx, cy);
    ctx.closePath();
    ctx.fill();
  }

  if (size > 26) {                                 // 小さいと稜線は潰れて汚れになるだけ
    ctx.strokeStyle = 'rgba(0,0,0,.28)';
    ctx.lineWidth = Math.max(1, size * 0.008);
    for (const q of p) { ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(cx, cy); ctx.stroke(); }
  }
}

// ---- 一枚 ------------------------------------------------------------------
function draw() {
  const W = innerWidth, H = innerHeight;
  ctx.fillStyle = '#0d0f0a';
  ctx.fillRect(0, 0, W, H);

  const cx = W / 2, cy = H / 2;
  const size = BOX * zoom;

  // 中の2体は屋根より先に消える。両方が半端に濃い区間を作らない
  const seen = ramp(zoom, 0.60, 0.80);             // 中の見え具合
  const roof = 1 - ramp(zoom, 0.46, 0.66);         // 屋根の被さり具合

  drawOpenBox(cx, cy, size);

  const r = Math.max(1.1, R_ADULT * zoom);
  if (actors && folk) {
    actors.begin(folk.length);
    if (seen > 0.01) {
      for (const f of folk) {
        actors.push(
          (cx + f.dx * size) * dpr, (cy + f.dy * size) * dpr, r * dpr,
          f.weak, f.hue1, f.hue2, f.sediment, SAT,
          f.corners, f.special, f.stripeV, f.stripeH, f.cells);
      }
    }
    actors.flush();
    glcv.style.opacity = seen.toFixed(3);
  } else if (seen > 0.01) {
    // **本物を読めていない。**それらしい個体を描かない。
    // 色相も形も持たない灰色の丸に落とす（見分けがつくことが要件）
    ctx.save();
    ctx.globalAlpha = seen;
    ctx.fillStyle = '#6f6f6b';
    for (const c of CAST) {
      ctx.beginPath();
      ctx.arc(cx + c.dx * size, cy + c.dy * size, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  if (roof > 0.01) {
    ctx.save();
    ctx.globalAlpha = roof;
    drawRoof(cx, cy, size);
    ctx.restore();
  }

  zlabel.textContent = '×' + zoom.toFixed(2);
  pxlabel.textContent = `家 ${size.toFixed(0)}px`;
}

// ---- 入力 ------------------------------------------------------------------
addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.min(ZMAX, Math.max(ZMIN, zoom * Math.exp(-e.deltaY * 0.0015)));
  draw();
}, { passive: false });

addEventListener('resize', resize);

// ---- 立ち上げ --------------------------------------------------------------
// **本編の見た目をそのまま作らせる。**十匹を生む関数に2体ぶんだけ生ませ、
// 読む関数に読ませる。角の数も縞も色相も、この頁は一度も書かない。
function buildFolk(L, R, RNG) {
  const n = CAST.length;
  const P = { a: {                                  // looks.js が読む形の、最小の器
    bloodMix: Array.from({ length: L.FOUNDER_COUNT },  () => new Float32Array(n)),
    look:     Array.from({ length: L.LOOK_COUNT },     () => new Float32Array(n)),
    rec:      Array.from({ length: L.REC_COUNT * 2 },  () => new Uint8Array(n)),
  } };
  const rng = new RNG(SEED);
  CAST.forEach((c, i) => L.foundLook(P, i, c.founder, rng));
  return CAST.map((c, i) => {
    const lk = L.lookOf(P, i);
    const bt = L.bloodTop2(P, i, k => R.FOUNDER_HUE[k]);
    return {
      ...c,
      hue1: R.FOUNDER_HUE[bt.first], hue2: bt.secondHue, sediment: bt.sediment,
      corners: lk.corners, special: lk.special, stripeV: lk.stripeV, stripeH: lk.stripeH,
      cells: R.cellsOf(c.mastery),                  // 熟練→細胞。数は run.js が決める
    };
  });
}

(async () => {
  try {
    const [M, L, A, R, G] = await Promise.all([
      import('../src/ui/map.js'),
      import('../src/world/looks.js'),
      import('../src/ui/actors.js'),
      import('../src/flow/run.js'),
      import('../src/core/rng.js'),
    ]);
    BOX = M.boxRect(0).w;        // 家の箱。**本編の実寸。**要件が正方形なので幅を一辺に使う
    R_ADULT = M.radiusOf({ grow: 1 });              // 成人の半径
    SAT = A.SAT_ALIVE;                              // 彩度＝生死
    folk = buildFolk(L, R, G.RNG);
    const layer = new A.ActorLayer(glcv);
    if (layer.ok) actors = layer;
    else note.textContent = 'WebGL2 が無い。個体は丸で描く';
  } catch (e) {
    // **黒い画面のまま黙らない。理由をそのまま出す。**推測で言い換えない
    note.textContent = `本編の見た目を読めていない（${e.message}）。個体は中立な丸。この絵は当てにならない`;
  }
  resize();
})();
</script>
</body>
</html>
