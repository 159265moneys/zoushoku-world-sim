<!doctype html>
<meta charset="utf-8">
<title>bench-webgl — スライムを何体出せるか</title>
<style>
  body{margin:0;background:#141210;color:#e8dfcc;font:13px/1.6 ui-monospace,monospace}
  #gl{display:block;max-width:100%;height:auto}
  #out{padding:12px 16px;white-space:pre;font-size:12px}
  h1{font-size:13px;margin:12px 16px 0;font-weight:700}
</style>
<canvas id="gl"></canvas>
<h1>bench-webgl</h1>
<div id="out">起動中…</div>
<script type="module">
// 個体を WebGL2 のインスタンス描画で出す。1体 = 1クアッド + フラグメントシェーダ。
// 描くもの：角丸N角形／星／ハート、血の色相、沈殿する第2の血、縦横の縞（交点＝水玉）、
//           目2つ、弱り（明度）、生死（彩度）。キャラビジュアル.md §1 の全部。
//
// 測るのは2通り：
//   split … x,y だけ毎フレーム送る（実際に動くのは位置だけなので、これが本番の形）
//   full  … 12個ぜんぶ毎フレーム送る（最悪の形）

const cv = document.getElementById('gl');
const out = document.getElementById('out');
const gl = cv.getContext('webgl2', { antialias: false, alpha: false, powerPreference: 'high-performance' });
if (!gl) { out.textContent = 'WebGL2 が無い'; throw new Error('no webgl2'); }

const VS = `#version 300 es
layout(location=0) in vec2 a_corner;      // クアッドの角 (-1..1)
layout(location=1) in vec2 a_pos;         // 位置          [動的]
layout(location=2) in vec4 a_body;        // r, corners, special, dark
layout(location=3) in vec4 a_blood;       // hue1, hue2, sediment, sat
layout(location=4) in vec2 a_pat;         // stripeV, stripeH
uniform vec2 u_res;
uniform float u_scale;
out vec2 v_uv;
out vec4 v_body;
out vec4 v_blood;
out vec2 v_pat;
out float v_px;
void main(){
  v_uv = a_corner; v_body = a_body; v_blood = a_blood; v_pat = a_pat;
  float r = a_body.x * u_scale;
  v_px = r;                                  // 画面上の半径。LODに使う
  vec2 p = a_pos + a_corner * r;              // 位置は盤面いっぱい。縮むのは大きさだけ
  gl_Position = vec4(p / u_res * 2.0 - 1.0, 0.0, 1.0);
  gl_Position.y = -gl_Position.y;
}`;

const FS = `#version 300 es
precision highp float;
in vec2 v_uv; in vec4 v_body; in vec4 v_blood; in vec2 v_pat; in float v_px;
out vec4 o;
const float TAU = 6.2831853;

vec3 hsl(float h, float s, float l){
  vec3 k = mod(vec3(0.0,8.0,4.0) + h/30.0, 12.0);
  float a = s * min(l, 1.0-l);
  return l - a * clamp(min(k-3.0, 9.0-k), -1.0, 1.0);
}

// この向きの「輪郭までの距離」。角は落としてある。
// 向きは揃える：多角形は底が平ら、星は先が上。並んだときに雑に見えないため。
float boundary(float ang, float n, float special){
  if (special > 1.5) {                        // ハート（極座標のハート曲線）
    float th = atan(-sin(ang), cos(ang));     // uv.y は下向きなので反転
    float st = sin(th);
    float r = 2.0 - 2.0*st + st*sqrt(abs(cos(th)))/(st + 1.4);
    return clamp(r / 3.5, 0.05, 1.0);
  }
  if (special > 0.5) {                        // 星（5つ尖り・先は上）
    float w = 0.5 + 0.5*cos(5.0*ang + 1.5708);
    return mix(0.40, 1.0, pow(w, 2.0));
  }
  if (n < 2.5) return 1.0;                    // 丸
  float seg = TAU / n;
  float ap  = cos(seg*0.5);                   // 内接半径（外接=1）
  float a   = mod(ang - 1.5708 + seg*0.5, seg) - seg*0.5;   // 底を平らにする
  float poly = ap / cos(a);
  float k = 0.30 * ap;                        // 角の落とし方。角数が少ないほど控えめに
  return mix(poly, 1.0, k);
}

void main(){
  vec2 uv = v_uv;
  float d = length(uv);
  if (d > 1.02) discard;
  float ang = atan(uv.y, uv.x);
  float rn = boundary(ang, v_body.y, v_body.z);
  float aa = max(fwidth(d), 0.5/max(v_px,1.0));
  float alpha = smoothstep(rn+aa, rn-aa, d);
  if (alpha <= 0.001) discard;

  float sat = v_blood.w;                      // 生死
  float lig = 0.66 * (1.0 - 0.42 * v_body.w); // 弱り

  // 血の1位／2位。第2の血は下に沈む
  float sed = v_blood.z;
  float line = 1.0 - 2.0*sed;
  float mixTo2 = smoothstep(line - aa, line + aa, uv.y);
  float hue = mix(v_blood.x, v_blood.y, mixTo2);
  vec3 col = hsl(hue, sat, lig);

  // 模様。縦と横が両方あれば交点だけ＝水玉
  if (v_px > 5.0) {
    float nv = v_pat.x, nh = v_pat.y;
    // 帯の「中心」に線を置く。+0.5 だと偶数本のとき線が縁に落ちる
    float mv = nv > 0.5 ? abs(fract((uv.x + 1.0) * nv * 0.5) - 0.5) : 1.0;
    float mh = nh > 0.5 ? abs(fract((uv.y + 1.0) * nh * 0.5) - 0.5) : 1.0;
    float th = 0.16;
    float ink = 0.0;
    if (nv > 0.5 && nh > 0.5)      ink = (1.0-smoothstep(th*0.7, th, mv)) * (1.0-smoothstep(th*0.7, th, mh));
    else if (nv > 0.5 || nh > 0.5) ink = 1.0 - smoothstep(th*0.7, th, min(mv, mh));
    col = mix(col, col * 0.62, ink * 0.85);
  }

  // 目。18px 以下では出さない
  if (v_px > 9.0) {
    float e = min(length(uv - vec2(-0.34,-0.20)), length(uv - vec2(0.34,-0.20)));
    float eye = 1.0 - smoothstep(0.13, 0.17, e);
    col = mix(col, vec3(0.09,0.08,0.07), eye);
  }
  o = vec4(col, alpha);
}`;

function sh(t, src){ const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const uRes = gl.getUniformLocation(prog, 'u_res');
const uScale = gl.getUniformLocation(prog, 'u_scale');

const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

const bPos = gl.createBuffer(), bBody = gl.createBuffer(), bBlood = gl.createBuffer(), bPat = gl.createBuffer();
function attr(loc, buf, n){ gl.bindBuffer(gl.ARRAY_BUFFER, buf); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, n, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(loc, 1); }
attr(1, bPos, 2); attr(2, bBody, 4); attr(3, bBlood, 4); attr(4, bPat, 2);

gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
gl.clearColor(0.078, 0.071, 0.063, 1);

// ---- 母集団 ----------------------------------------------------------------
let N = 0, pos, vel, body, blood, pat;
let W = 0, H = 0;
function seed(n){
  N = n;
  pos = new Float32Array(n*2); vel = new Float32Array(n*2);
  body = new Float32Array(n*4); blood = new Float32Array(n*4); pat = new Float32Array(n*2);
  let s = 12345;
  const rnd = () => (s = (s*1664525 + 1013904223) >>> 0) / 4294967296;
  const HUES = [18, 63, 108, 153, 198, 243, 288, 333];      // 世界ローカル8枠
  for (let i=0;i<n;i++){
    pos[i*2] = rnd()*W; pos[i*2+1] = rnd()*H;
    vel[i*2] = (rnd()-0.5)*14; vel[i*2+1] = (rnd()-0.5)*14;
    const corners = rnd()<0.45 ? 0 : (3 + Math.floor(rnd()*6));
    const sp = rnd()<0.03 ? 1 : (rnd()<0.02 ? 2 : 0);
    body[i*4] = 3 + rnd()*9;                 // r（年齢）
    body[i*4+1] = corners; body[i*4+2] = sp; body[i*4+3] = rnd()*rnd();   // 弱り
    const h1 = HUES[Math.floor(rnd()*8)], h2 = HUES[Math.floor(rnd()*8)];
    blood[i*4] = h1; blood[i*4+1] = h2;
    blood[i*4+2] = rnd()<0.55 ? 0 : rnd()*0.5;   // 沈殿
    blood[i*4+3] = 0.42 + rnd()*0.2;             // 彩度（生死）
    pat[i*2] = rnd()<0.5 ? 0 : Math.floor(rnd()*5)+1;
    pat[i*2+1] = rnd()<0.5 ? 0 : Math.floor(rnd()*5)+1;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, bPos);   gl.bufferData(gl.ARRAY_BUFFER, pos,   gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bBody);  gl.bufferData(gl.ARRAY_BUFFER, body,  gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bBlood); gl.bufferData(gl.ARRAY_BUFFER, blood, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bPat);   gl.bufferData(gl.ARRAY_BUFFER, pat,   gl.DYNAMIC_DRAW);
}

let moveMs = 0;
function move(dt){
  const t0 = performance.now();
  for (let i=0;i<N;i++){
    let x = pos[i*2] + vel[i*2]*dt, y = pos[i*2+1] + vel[i*2+1]*dt;
    if (x<0||x>W) { vel[i*2]*=-1; x = Math.min(Math.max(x,0),W); }
    if (y<0||y>H) { vel[i*2+1]*=-1; y = Math.min(Math.max(y,0),H); }
    pos[i*2]=x; pos[i*2+1]=y;
  }
  moveMs = performance.now() - t0;
}

function draw(mode, scale){
  gl.bindBuffer(gl.ARRAY_BUFFER, bPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, pos);
  if (mode === 'full') {
    gl.bindBuffer(gl.ARRAY_BUFFER, bBody);  gl.bufferSubData(gl.ARRAY_BUFFER, 0, body);
    gl.bindBuffer(gl.ARRAY_BUFFER, bBlood); gl.bufferSubData(gl.ARRAY_BUFFER, 0, blood);
    gl.bindBuffer(gl.ARRAY_BUFFER, bPat);   gl.bufferSubData(gl.ARRAY_BUFFER, 0, pat);
  }
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(uRes, W, H);
  gl.uniform1f(uScale, scale);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, N);
}

// 盤面の大きさは固定にする。窓の大きさで数字が変わると比べられないので。
// 1600x900 = だいたい 1920 の窓からUIを引いた実効の盤面。
const BOARD_W = 1600, BOARD_H = 900;
function resize(){
  W = BOARD_W; H = BOARD_H;
  cv.width = W; cv.height = H;
  cv.style.width = '100%'; cv.style.height = 'auto';
  gl.viewport(0,0,cv.width,cv.height);
}
resize();

// ---- 計測 ------------------------------------------------------------------
// 「1体あたりの画面上の大きさ」を揃えて測る。人数が増えたら小さくなるのが本番の形。
const CASES = [
  { n: 500,     scale: 1.0,  note: '村×数個（18〜24px）' },
  { n: 1000,    scale: 1.0,  note: '' },
  { n: 2000,    scale: 0.7,  note: '' },
  { n: 5000,    scale: 0.45, note: '' },
  { n: 10000,   scale: 0.32, note: '1万（8px前後）' },
  { n: 30000,   scale: 0.19, note: '' },
  { n: 100000,  scale: 0.10, note: '10万（4px前後）' },
  { n: 200000,  scale: 0.07, note: '限界を探す' },
];
const rows = [];

// rAF は使わない（このブラウザは document.hidden で回らない）。
// 1ケースを同期で回しきる。gl.finish() で GPU の完了まで待つので、これで正しく測れる。
function pixProbe(){                       // 本当に描けているかを確かめる
  const px = new Uint8Array(4 * 64 * 64);
  gl.readPixels(768, 400, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let lit = 0;
  for (let k=0;k<px.length;k+=4) if (px[k]>25 || px[k+1]>25 || px[k+2]>25) lit++;
  return lit;                              // 背景(20,18,16)より明るい画素の数
}

function runCase(n, scale, mode, note){
  if (n !== N) seed(n);
  const F = 60;
  // 温め
  for (let f=0; f<15; f++){ move(1/60); draw(mode, scale); }
  pixProbe();
  // 本番。60フレームを一気に回し、readPixels で GPU の完了まで待ってから割る
  let moveAcc = 0;
  const t0 = performance.now();
  for (let f=0; f<F; f++){
    const m0 = performance.now();
    move(1/60);
    moveAcc += performance.now() - m0;
    draw(mode, scale);
  }
  const lit = pixProbe();                  // ここで全部の描画が終わる
  const total = performance.now() - t0;
  const per = total / F, mv = moveAcc / F;
  const row = { n, mode, scale,
                frameMs: +per.toFixed(3), drawMs: +(per-mv).toFixed(3), moveMs: +mv.toFixed(3),
                fps: Math.round(1000/Math.max(per,0.001)), lit, note: note||'' };
  rows.push(row); render();
  return row;
}

function render(){
  const pad = (s,w)=>String(s).padStart(w);
  let t = 'gl: ' + gl.getParameter(gl.VERSION) + '\n';
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  if (dbg) t += 'gpu: ' + gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) + '\n';
  t += `\u76e4\u9762: ${cv.width}x${cv.height}\n\n`;
  t += '      体数  送り方   倍率   1フレームms   描画ms  位置更新ms     fps   画素\n';
  for (const r of rows)
    t += `${pad(r.n,10)}  ${pad(r.mode,5)}  ${pad(r.scale,5)}  ${pad(r.frameMs,11)}  ${pad(r.drawMs,7)}  ${pad(r.moveMs,10)}  ${pad(r.fps,6)}  ${pad(r.lit,5)}  ${r.note}\n`;
  out.textContent = t;
}

// 見た目の確認用。形と模様の全パターンを格子に並べる
window.showGrid = function(){
  const shapes = [[0,0],[3,0],[4,0],[5,0],[6,0],[8,0],[0,1],[0,2]];  // 丸 三 四 五 六 八 星 ハート
  const pats   = [[0,0],[3,0],[0,3],[3,3],[5,5],[2,2],[4,0]];        // 無地 縦 横 格子 細水玉 太水玉 縦4
  const HUES   = [18,63,108,153,198,243,288,333];
  const n = shapes.length * pats.length;
  N = n;
  pos = new Float32Array(n*2); vel = new Float32Array(n*2);
  body = new Float32Array(n*4); blood = new Float32Array(n*4); pat = new Float32Array(n*2);
  let k = 0;
  for (let r=0; r<pats.length; r++) for (let c=0; c<shapes.length; c++, k++){
    pos[k*2] = 110 + c*195; pos[k*2+1] = 80 + r*128;
    body[k*4] = 50; body[k*4+1] = shapes[c][0]; body[k*4+2] = shapes[c][1];
    body[k*4+3] = (r===6 && c>4) ? 0.9 : 0;                 // 右下だけ「弱っている」
    blood[k*4] = HUES[c]; blood[k*4+1] = HUES[(c+3)%8];
    blood[k*4+2] = (r>=5) ? 0.34 : 0;                       // 下2行は混血（沈殿あり）
    blood[k*4+3] = 0.5;
    pat[k*2] = pats[r][0]; pat[k*2+1] = pats[r][1];
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, bPos);   gl.bufferData(gl.ARRAY_BUFFER, pos,   gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bBody);  gl.bufferData(gl.ARRAY_BUFFER, body,  gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bBlood); gl.bufferData(gl.ARRAY_BUFFER, blood, gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bPat);   gl.bufferData(gl.ARRAY_BUFFER, pat,   gl.DYNAMIC_DRAW);
  draw('split', 1.0);
  return n;
};

window.CASES = CASES;
window.runCase = runCase;
window.benchRows = rows;
seed(CASES[0].n);
render();
out.textContent += '\n準備できた。runCase(n, scale, mode) を呼ぶ\n';
</script>
